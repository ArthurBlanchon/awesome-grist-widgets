name: Check the registry

# On every pull request: the build script's tests, then each entry's
# grist-widget.json manifest fetched from its install URL and validated
# (an SDK widget's release build, naming the entry's own repository), and
# README.md, widgets.json and grist-widgets.json listing exactly
# registry.json's entries.
# Data only: no widget code runs.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "scripts/*.test.mjs"
      - run: node scripts/build.mjs --check
