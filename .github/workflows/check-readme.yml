name: Check README is in sync with widgets.json

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check-readme
