name: Publish the registry

# Builds widgets.json and grist-widgets.json from registry.json and each
# widget's live manifest, and publishes them on GitHub Pages:
#   https://arthurblanchon.github.io/awesome-grist-widgets/widgets.json
#   https://arthurblanchon.github.io/awesome-grist-widgets/grist-widgets.json
# After every merge, and daily, so they follow each widget's releases
# without a commit. It reads data only (no widget code runs, no
# dependency is installed), and holds only the Pages permissions.
# One-time setting: Settings -> Pages -> Source: GitHub Actions.

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs --site _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
